[package]
name = "valyze"
version = "0.1.0"
description = "Valyze desktop client"
authors = ["Xarxavier"]
edition = "2021"

[lib]
name = "valyze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync"] }
